# Local development database for the Movies backend.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data volume)
#
# Values can be overridden with environment variables or a .env file next to this file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: movies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movies}
      POSTGRES_USER: ${POSTGRES_USER:-movies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movies-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movies-db-data:
