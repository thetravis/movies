spring:
  application:
    name: movies

  # Defaults match docker-compose.yml; override with environment variables in other environments.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:movies}
    username: ${DB_USERNAME:movies}
    password: ${DB_PASSWORD:movies}

  jpa:
    # Schema is managed by Liquibase changesets (db/changelog), never by Hibernate.
    # Hibernate only checks at startup that the entities match the tables.
    # Initial data is loaded by MovieImporter (see movies.seed below).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Loads lazy collections (actors, genres) for many movies in one query instead of one per movie.
        default_batch_fetch_size: 50

# Swagger UI at /swagger-ui.html shows the contract file (served by OpenApiContractConfig),
# not a spec generated from the code.
springdoc:
  swagger-ui:
    url: /openapi.yaml

# Movies loaded from a JSON file on startup (see MovieImporter). Existing movies (same name and
# year) are skipped, so this is safe on every startup.
# Override with env vars MOVIES_SEED_ENABLED / MOVIES_SEED_FILE, e.g. MOVIES_SEED_FILE=file:C:/data/movies.json
movies:
  seed:
    enabled: true
    file: classpath:data/movies-compact.json
